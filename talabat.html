<style>
/* ==== Dark Mode for talabat page ==== */
body.dark-mode .content-container{
  background:#0f1024;
  color:#f0f1ff;
  box-shadow:0 8px 22px rgba(0,0,0,0.35);
  border:1px solid #2b2d52;
  border-radius:16px;
  padding:20px;
}

/* العنوان والأيقونة */
body.dark-mode .content-container h2{
  color:#9c9ede;
}
body.dark-mode .content-container h2 i{
  color:#b9bbef;
}

/* قائمة الطلبات */
body.dark-mode .orders-list{
  background:#05050b;
  border:1px solid #2b2d52;
  color:#f0f1ff;
  border-radius:14px;
  padding:12px;
}
body.dark-mode .orders-list::-webkit-scrollbar-track{ background:#05050b; }
body.dark-mode .orders-list::-webkit-scrollbar-thumb{ background:#7a7cd0; }

/* الفوتر ومربعات الأيقونات */
body.dark-mode .footerContainer{
  background:linear-gradient(135deg,#414391,#1c1d38);
  box-shadow:0 8px 18px rgba(0,0,0,0.35);
}
body.dark-mode .footer-title{
  color:#f0f1ff;
}

/* صيانة وثيمات عامة (متزامنة مع الموقع الرئيسي) */
#maintenance-overlay{
  position:fixed;inset:0;z-index:15000;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,6,20,.92);
  color:#f8f9ff;text-align:center;padding:30px;
  backdrop-filter:blur(3px);
}
#maintenance-overlay .card{
  background:#0f172a;border:1px solid rgba(124,126,208,.35);
  padding:24px 20px;border-radius:16px;max-width:520px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
#maintenance-overlay h2{margin:0 0 10px;font-size:1.5rem;}
#maintenance-overlay p{margin:6px 0;color:#cbd5e1;}
#maintenance-overlay .countdown{font-weight:800;color:#fbbf24;}
body.theme-fall{
  background:radial-gradient(circle at 20% 20%, rgba(255,165,0,.08), transparent 35%), #0a0b1a;
}
body.theme-fall .leaf{
  position:fixed;top:-10%;width:24px;height:24px;
  background:linear-gradient(135deg,#f59e0b,#d97706);opacity:.75;
  border-radius:4px;animation:falling 12s linear infinite;z-index:50;pointer-events:none;
}
body.theme-fall .leaf:nth-child(odd){background:linear-gradient(135deg,#fbbf24,#f59e0b);}
body.theme-snow{
  background:linear-gradient(180deg,#0b1024,#0f172a 40%,#0a0f1f);
}
body.theme-snow .snowflake{
  position:fixed;top:-8%;color:#e0e9ff;font-size:14px;opacity:.8;
  animation:snowfall 11s linear infinite;pointer-events:none;z-index:50;
  text-shadow:0 0 6px rgba(255,255,255,.35);
}
body.theme-ramadan{
  background:radial-gradient(circle at 20% 20%, rgba(255,215,0,.08), transparent 35%), #0b0c1f;
}
body.theme-eid{
  background:linear-gradient(135deg,#0b132b,#1f1c2c 60%,#0f172a);
}
@keyframes falling{
  0%{transform:translate3d(0,0,0) rotate(0deg);}
  100%{transform:translate3d(-20vw,110vh,0) rotate(720deg);}
}
@keyframes snowfall{
  0%{transform:translateY(-10%) translateX(0);}
  100%{transform:translateY(115vh) translateX(20px);}
}
body.dark-mode .icon-box{
  background:#0f1024;
  color:#f0f1ff;
  box-shadow:0 6px 14px rgba(0,0,0,0.30);
  border:1px solid #2b2d52;
}
body.dark-mode .icon-box i{ color:#9c9ede; }
body.dark-mode .icon-box h3{ color:#f0f1ff; }
body.dark-mode .icon-box p{ color:#cbd5e1; }


/* Dark mode style for order cards */
body.dark-mode .order-card {
  background: #1a2234;        /* خلفية داكنة */
  color: #f0f1ff;             /* النصوص فاتحة */
  border: 1px solid #2b2d52;  /* إطار أنعم */
}

body.dark-mode .order-card .order-header {
  background: #0f1024;        /* تمييز الهيدر داخل الكارد */
  color: #f0f1ff;
}

body.dark-mode .order-card .order-status {
  color: #fbbf24;             /* أصفر للتأكيد */
}

body.dark-mode .order-card .order-details {
  background: #05050b;
  color: #dbe2ea;
}

/* تحسين النصوص في تفاصيل الطلب للوضع الداكن */
body.dark-mode .order-card .order-details {
  background: #05050b;
  color: #ffffff;              /* جعل النص أبيض واضح */
}

body.dark-mode .order-card .order-details p,
body.dark-mode .order-card .order-details li,
body.dark-mode .order-card .order-details strong,
body.dark-mode .order-card .order-details span {
  color: #ffffff !important;   /* ضمان أن كل النصوص تكون بيضاء */
}

/* حركات ظهور/اختفاء البطاقات عند البحث أو التحديث (سحب من اليمين لكل بطاقة) */
.order-card.anim-enter-right{animation:orderCardInRight .28s ease forwards;}
.order-card.anim-exit-right{animation:orderCardOutRight .22s ease forwards;}
@keyframes orderCardInRight{
  from{opacity:0;transform:translateX(18px);}
  to{opacity:1;transform:translateX(0);}
}
@keyframes orderCardOutRight{
  from{opacity:1;transform:translateX(0);}
  to{opacity:0;transform:translateX(18px);}
}

body.dark-mode .order-card .order-details strong {
  color: #9c9ede !important;   /* تمييز النص الغامق بلون أزرق فاتح */
}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;font-weight:700}

body.dark-mode .chip{background:#0f1024;border-color:#2b2d52;color:#f0f1ff}
body.dark-mode .chip[data-filter="all"].active{background:#151836;border-color:#7a7cd0;color:#9c9ede}

body.dark-mode .chip[data-filter="approved"]{background:#064e3b;border-color:#047857;color:#bbf7d0}
body.dark-mode .chip[data-filter="rejected"]{background:#3f1d1d;border-color:#7f1d1d;color:#fecaca}
.orders-search{

/* ======== Mobile Clean Patch (≤480px) ======== */
@media (max-width: 480px) {
  /* الهيدر غالبًا ثابت، وعندك body فيه padding-top مكرر 60/70px.
     ثبّتناه على 56px عشان مايبقاش فيه فراغ زائد. */
  body { padding-top: 56px !important; }

  /* الحاوية الرئيسية: عرض كامل، بدون ظل ثقيل */
  .content-container{
    max-width: none;
    width: 100%;
    margin: 56px 0 10px;
    padding: 8px;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
  }

  /* مساحة جانبية بسيطة للّست */
  #ordersContainer { padding: 0 8px; }

  /* الكرت: تبسيط تام + تباين واضح */
  .order-card{
    background: #0f1024;                 /* داكن نظيف */
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: none;
    border-radius: 12px;
    padding: 0;                           /* الرأس يحمل الحشو */
    margin-bottom: 10px;
    transform: none;
  }
  .order-card::after{ display: none; }    /* إلغاء توهج الزاوية */

  /* رأس الكرت: منطقة ضغط كبيرة + شبكة مرتبة */
  .order-header{
    display: grid;
    grid-template-columns: 1fr auto 16px; /* معلومات | شارة | سهم */
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: transparent;
  }
  .order-header > div:first-child{
    font-size: 14px;
    line-height: 1.5;
    color: #f0f1ff;
  }
  .order-header i{                         /* السهم */
    font-size: 14px;
    margin: 0;
    transition: transform .2s ease;
  }
  /* تدوير السهم عند الفتح (سنضيف كلاس .open بالـ JS) */
  .order-card.open .order-header i { transform: rotate(180deg); }

  /* شارة الحالة كبادج صغيرة */
  .order-status{
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    line-height: 1;
    white-space: nowrap;
  }

  /* تفاصيل الطلب: قراءة أسهل */
  .order-details{
    display: none;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: #05050b;
    padding: 12px;
    font-size: 13.5px;
    line-height: 1.6;
    border-radius: 0 0 12px 12px;
  }

  /* زر إثبات التحويل: عريض وواضح */
  .btn-show-proof{
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
  }

  /* سلوك أفضل لشاشات اللمس */
  @media (pointer: coarse) {
    .order-card:hover,
    .order-card:active { transform: none; box-shadow: none; }
  }
}

/* ======== Mobile Clean Patch (≤480px) ======== */
@media (max-width: 480px) {
  body { padding-top: 56px !important; }

  .content-container {
    max-width: none;
    width: 100%;
    margin: 56px 0 10px;

    display: grid;
    grid-template-columns: 1fr auto 16px;
    align-items: center;

  }
  .order-header > div:first-child {

  }
  .order-header i {

  }

    padding: 12px;

}

<title>طلباتي</title>
  <link rel="icon" href="emp.png" type="image/png">
</head>
<body>
<div id="headerContainer"></div>
<div id="sidebarContainer"></div>
<div id="preloader">
  <div class="loader"></div>
</div>
<div id="ordersContainer"></div>
<div style="height: 50px;"></div>
<div id="footerContainer"></div>
<script>
  // 1) فعّل الثيم المحفوظ مبكرًا قدر الإمكان
  (function(){
    try{
      if(localStorage.getItem('theme') === 'dark'){
        document.body.classList.add('dark-mode');
      }
    }catch(e){}
  })();

  // 2) انتظر DOMContentLoaded لضمان جاهزية العناصر وملفات defer (مثل header.js)
  window.addEventListener('DOMContentLoaded', () => {
    // إنشاء الحاوية الرئيسية للمحتوى
    const contentContainer = document.createElement('div');
    contentContainer.className = 'content-container';

    // العنوان + الأيقونة
    const heading = document.createElement('h2');
    const icon = document.createElement('i');
    // Font Awesome v6
    icon.className = 'fa-solid fa-history';
    heading.appendChild(icon);
    heading.append(' طلباتي:');
    contentContainer.appendChild(heading);

    // شريط الأدوات: فلاتر الحالة + اختيار التاريخ
    const toolbar = document.createElement('div');
    toolbar.className = 'toolbar';
    toolbar.id = 'ordersToolbar';
    toolbar.innerHTML = `
      <button class="chip" data-filter="all">الكل</button>
      <button class="chip" data-filter="pending">قيد الانتظار</button>
      <button class="chip" data-filter="approved">تم الشحن</button>
      <button class="chip" data-filter="rejected">مرفوض</button>
      <span style="flex:1 1 auto"></span>
      <button class="chip" id="dateChip">التاريخ</button>
      <input type="date" id="ordersDatePicker" style="display:none" />
    `;
    contentContainer.appendChild(toolbar);

    // شريط البحث عن الطلبات (كود / آيدي / مزود ...)
    const searchRow = document.createElement('div');
    searchRow.className = 'orders-search';
    searchRow.innerHTML = `
      <i class="fa fa-search" aria-hidden="true"></i>
      <input type="search" id="ordersSearch" placeholder="ابحث برقم الطلب أو الآيدي أو المبلغ..." autocomplete="off" />
    `;
    contentContainer.appendChild(searchRow);

    // قائمة الطلبات
    const ordersList = document.createElement('div');
    ordersList.id = 'ordersList';
    ordersList.className = 'orders-list';
    contentContainer.appendChild(ordersList);

    // إدراج المحتوى في مكانه
    const container = document.getElementById('ordersContainer');
    if (container) {
      container.appendChild(contentContainer);
    } else {
      console.error('لم يتم العثور على العنصر بالمعرف "ordersContainer"');
    }

    // ====== دوال مساعدة ======
    window.toggleOffer = function(el) {
      el.classList.toggle('selected');
    };

    window.showOrderDetails = function(orderCode) {
      const detailsEl = document.getElementById('orderDetails');
      if (!detailsEl) return; // تأكد من وجود العنصر

      if (orderCode) {
        detailsEl.style.display = 'block';
        detailsEl.innerHTML = '<p>تفاصيل الطلب لكود: <strong>' + orderCode + '</strong></p>';
      } else {
        detailsEl.style.display = 'none';
        detailsEl.innerHTML = '';
      }
    };
  });

function toggleDetails(code) {
  const d = document.getElementById(`details-${code}`);
  const card = document.getElementById(`order-${code}`);
  if (!d || !card) return;

  const isOpen = d.style.display === 'block';
  d.style.display = isOpen ? 'none' : 'block';
  card.classList.toggle('open', !isOpen);   // يضيف/يحذف كلاس للتحريك البصري
}

// ====== صيانة / ثيمات (مزامنة مع config/siteState) ======
let maintenanceTimer = null;
function applyMaintenanceState(state){
  const on = state?.on === true;
  const untilStr = state?.until || "";
  const untilMs = untilStr ? Date.parse(untilStr) : null;
  if (!on) {
    const el = document.getElementById("maintenance-overlay");
    if (el) el.remove();
    if (maintenanceTimer) { clearInterval(maintenanceTimer); maintenanceTimer = null; }
    return;
  }
  let overlay = document.getElementById("maintenance-overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "maintenance-overlay";
    overlay.innerHTML = `<div class="card"><h2>🚧 الموقع في وضع الصيانة</h2><p>الرجاء العودة لاحقاً.</p><p class="countdown"></p></div>`;
    document.body.appendChild(overlay);
  }
  const cd = overlay.querySelector(".countdown");
  if (maintenanceTimer) clearInterval(maintenanceTimer);
  maintenanceTimer = setInterval(() => {
    if (untilMs && Date.now() > untilMs) {
      applyMaintenanceState({ on: false });
      return;
    }
    if (cd) {
      if (untilMs) {
        const diff = Math.max(0, untilMs - Date.now());
        const mins = Math.floor(diff / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        cd.textContent = `الوقت المتبقي: ${mins} دقيقة ${secs} ثانية`;
      } else {
        cd.textContent = "بدون وقت انتهاء";
      }
    }
  }, 1000);
}

function applyThemeState(theme){
  const name = String(theme?.name || "").toLowerCase();
  const color = String(theme?.color || "").trim();
  const classes = ["theme-fall","theme-snow","theme-ramadan","theme-eid"];
  classes.forEach(cls => document.body.classList.remove(cls));
  if (name === "fall" || name === "autumn" || name === "خريف") document.body.classList.add("theme-fall");
  else if (name === "snow" || name === "winter" || name === "ثلج") document.body.classList.add("theme-snow");
  else if (name === "ramadan" || name === "رمضان") document.body.classList.add("theme-ramadan");
  else if (name === "eid" || name === "عيد") document.body.classList.add("theme-eid");
  if (color) document.documentElement.style.setProperty("--accent-theme", color);
}

let siteStateUnsub = null;
// تأثيرات الثيم (أوراق/ثلوج)
function clearThemeParticles(){
  document.querySelectorAll(".leaf,.snowflake").forEach(el => el.remove());
}
function spawnThemeParticles(kind,count=18){
  clearThemeParticles();
  const frag=document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const el=document.createElement("div");
    if(kind==="leaf"){
      el.className="leaf";
      el.style.left=`${Math.random()*100}vw`;
      el.style.animationDelay=`${Math.random()*4}s`;
      el.style.animationDuration=`${10+Math.random()*6}s`;
    } else if(kind==="snow"){
      el.className="snowflake";
      el.textContent="❄";
      el.style.left=`${Math.random()*100}vw`;
      el.style.animationDelay=`${Math.random()*5}s`;
      el.style.animationDuration=`${10+Math.random()*6}s`;
      el.style.fontSize=`${12+Math.random()*8}px`;
    }
    frag.appendChild(el);
  }
  document.body.appendChild(frag);
}
const __applyThemeStateBase = applyThemeState;
applyThemeState = function(theme){
  __applyThemeStateBase(theme);
  const name = String(theme?.name || "").toLowerCase();
  if (name === "fall" || name === "autumn" || name === "خريف") {
    spawnThemeParticles("leaf",18);
  } else if (name === "snow" || name === "winter" || name === "ثلج") {
    spawnThemeParticles("snow",26);
  } else {
    clearThemeParticles();
  }
};

function startSiteStateListener(){
  try{
    if (!db || typeof db.collection !== "function") return;
    if (siteStateUnsub) return;
    siteStateUnsub = db.collection("config").doc("siteState").onSnapshot((snap)=>{
      const data = snap.exists ? snap.data() : {};
      applyThemeState(data?.theme || {});
      applyMaintenanceState(data?.maintenance || {});
    });
  }catch(err){ console.warn("siteState listener failed", err?.message || err); }
}

document.addEventListener("DOMContentLoaded", ()=>{ startSiteStateListener(); setTimeout(startSiteStateListener, 1200); });




</script>
