<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور</title>
  <style>
    :root{
      --primary:#4f46e5;
      --primary2:#7c3aed;
      --surface:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --danger:#b91c1c;
      --success:#0f9d58;
      --radius:16px;
    }
    *{box-sizing:border-box;font-family:'Cairo',sans-serif}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:
        radial-gradient(900px 520px at 20% 0%, rgba(124,58,237,.12), transparent 50%),
        radial-gradient(900px 520px at 80% 100%, rgba(79,70,229,.12), transparent 50%),
        linear-gradient(135deg,#f5f3ff,#eef2ff);
      color:var(--text);
    }
    .card{
      width: min(520px, 100%);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 16px 50px rgba(0,0,0,.12);
      border:1px solid rgba(17,24,39,.06);
    }
    h1{margin:0 0 8px;font-size:1.4rem}
    p{margin:0 0 12px;color:var(--muted);line-height:1.6}
    .input-group{margin:14px 0}
    input{
      width:100%;
      padding:14px 12px;
      border-radius:12px;
      border:1px solid rgba(17,24,39,.12);
      font-size:1rem;
      background:#fff;
    }
    input:focus{
      outline:none;
      border-color:var(--primary);
      box-shadow:0 0 0 4px rgba(79,70,229,.16);
    }
    button{
      width:100%;
      padding:12px 14px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      color:#fff;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      font-size:1rem;
      font-weight:700;
      transition:transform .06s ease, opacity .15s ease;
    }
    button:disabled{opacity:.6;cursor:not-allowed}
    button:active{transform:translateY(1px)}
    .status{margin-top:10px;font-weight:600}
    .success{color:var(--success)}
    .error{color:var(--danger)}
    .hidden{display:none}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      background:rgba(79,70,229,.12);
      color:#312e81;
      padding:8px 12px;
      border-radius:10px;
      margin-bottom:8px;
      border:1px solid rgba(79,70,229,.18);
      font-weight:700;
    }
    .meta{font-size:.95rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge">🔒 استعادة كلمة المرور</div>
    <h1 id="title">جارٍ التحقق من الرابط…</h1>
    <p id="descr">برجاء الانتظار لحظات.</p>

    <div id="resetForm" class="hidden">
      <p class="meta" id="emailLabel"></p>
      <div class="input-group">
        <input id="newPass" type="password" placeholder="كلمة مرور جديدة (6 أحرف أو أكثر)">
      </div>
      <button id="submitBtn">تعيين كلمة المرور</button>
    </div>

    <p class="status error hidden" id="errorMsg"></p>
    <p class="status success hidden" id="successMsg"></p>
    <button id="goLogin" class="hidden" onclick="window.location.href='login.html'">العودة لتسجيل الدخول</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const config = {
      apiKey:"AIzaSyBRVEViuKnCUZqBoD0liuA-P0DVN7mTePA",
      authDomain:"z3em-d9b11.firebaseapp.com",
      projectId:"z3em-d9b11",
      storageBucket:"z3em-d9b11.firebasestorage.app",
      messagingSenderId:"236716520945",
      appId:"1:236716520945:web:a0c336db7dc7079c190050",
      measurementId:"G-1GG6DE12K6"
    };

    const params = new URLSearchParams(location.search);
    const mode = params.get("mode");
    const oobCode = params.get("oobCode");
    const titleEl = document.getElementById("title");
    const descrEl = document.getElementById("descr");
    const formEl = document.getElementById("resetForm");
    const emailLabel = document.getElementById("emailLabel");
    const newPass = document.getElementById("newPass");
    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const goLogin = document.getElementById("goLogin");

    const showError = (msg) => {
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
      successMsg.classList.add("hidden");
    };
    const showSuccess = (msg) => {
      successMsg.textContent = msg;
      successMsg.classList.remove("hidden");
      errorMsg.classList.add("hidden");
    };

    if (!mode || !oobCode) {
      titleEl.textContent = "رابط غير صالح";
      descrEl.textContent = "المعلمات ناقصة في الرابط.";
      showError("تحقق أن الرابط كامل ثم أعد المحاولة.");
      goLogin.classList.remove("hidden");
      return;
    }

    if (mode !== "resetPassword") {
      titleEl.textContent = "رابط غير مدعوم";
      descrEl.textContent = "يمكن لهذا الرابط فقط إعادة تعيين كلمة المرور.";
      showError("استخدم رابط إعادة تعيين كلمة المرور من البريد.");
      goLogin.classList.remove("hidden");
      return;
    }

    let auth;
    try {
      const app = initializeApp(config);
      auth = getAuth(app);
    } catch (e) {
      showError("تعذر تهيئة Firebase. أعد تحميل الصفحة.");
      goLogin.classList.remove("hidden");
    }

    (async () => {
      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        titleEl.textContent = "إعادة تعيين كلمة المرور";
        descrEl.textContent = "أدخل كلمة مرور جديدة وسيتم تطبيقها على حسابك.";
        emailLabel.textContent = `سيتم التعديل للحساب: ${email}`;
        formEl.classList.remove("hidden");
      } catch (e) {
        titleEl.textContent = "رابط منتهي أو غير صالح";
        descrEl.textContent = "استخدم رابطًا جديدًا لإعادة التعيين.";
        showError("الرابط منتهي الصلاحية أو غير صالح. اطلب رابطًا جديدًا.");
        goLogin.classList.remove("hidden");
        return;
      }
    })();

    submitBtn?.addEventListener("click", async () => {
      if (!auth) return;
      const pass = (newPass.value || "").trim();
      if (pass.length < 6) {
        showError("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "جارٍ الحفظ...";
      errorMsg.classList.add("hidden");
      successMsg.classList.add("hidden");
      try {
        await confirmPasswordReset(auth, oobCode, pass);
        showSuccess("تم تحديث كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول.");
        goLogin.classList.remove("hidden");
      } catch (e) {
        showError("تعذر تعيين كلمة المرور. جرّب رابطًا جديدًا.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "تعيين كلمة المرور";
      }
    });
  </script>
</body>
</html>
