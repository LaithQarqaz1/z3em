<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة</title>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"></noscript>
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"></noscript>
  <link rel="preload" href="header.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <script src="header.js" defer></script>
  <style>
    :root{
      --bg1:#050910;
      --bg2:#0b1220;
      --text:#e5e7eb;
    }
    *{box-sizing:border-box;font-family:'Cairo',sans-serif}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(1200px 700px at 50% 20%,rgba(255,255,255,.04),transparent 60%),linear-gradient(145deg,var(--bg1),var(--bg2));
      color:var(--text);
      padding:0;
    }
    main{
      min-height:calc(100vh - 140px);
      padding:120px 24px 48px;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:16px;
    }
    .logo{
      width:150px;
      height:150px;
      border-radius:50%;
      overflow:hidden;
      background:rgba(255,255,255,.05);
      display:grid;
      place-items:center;
      box-shadow:0 20px 70px rgba(0,0,0,.45);
    }
    .logo img{
      width:94%;
      height:94%;
      object-fit:cover;
      border-radius:50%;
      filter:drop-shadow(0 6px 18px rgba(0,0,0,.45));
    }
    h1{
      margin:0;
      font-size:1.8rem;
      letter-spacing:.2px;
    }
    /* قسم الدعم: فرض الوضع الداكن لهذه الصفحة */
    .support-section{
      background:var(--bg1);
      border-top:1px solid #1c1d38;
      color:var(--text);
    }
    .support-title{color:var(--text);}
    .support-icons .support-icon{
      background:#0f1628;
      box-shadow:0 8px 18px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.05);
    }
    .support-icon:hover{box-shadow:0 10px 24px rgba(0,0,0,.55);}
    @media(max-width:520px){
      main{
        min-height:calc(100vh - 120px);
        padding:110px 16px 36px;
      }
    }
  </style>
</head>
<body>
  <div id="headerContainer"></div>
  <div id="sidebarContainer"></div>
  <main>
    <div class="logo">
      <img src="emp.png" alt="شعار المتجر">
    </div>
    <h1>الصفحة غير موجودة</h1>
  </main>
</body>
</html>
